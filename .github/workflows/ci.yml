# Runs on every PR into dev or main (tech plan section 10).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      # Time must come from the injected clock (decision record 0004).
      - name: No DateTime.now() in lib
        run: |
          if grep -rn "DateTime.now()" lib --include=*.dart; then
            echo "Use the injected Clock instead of DateTime.now()."
            exit 1
          fi

      - name: Tests
        run: flutter test

      - name: Acceptance test coverage (report only)
        run: dart run tool/at_coverage.dart

      - name: Build release APK
        run: flutter build apk --release

      # v1 must never reach the network (PRD 3, 13; AT-011).
      - name: Release APK has no network permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "The release APK must not request network permissions."
            exit 1
          fi
