name: sahai
description: "Sahai (GTD AI): an offline-first task manager that shows only the next step."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3
  # Pinned: upgrading Flutter is its own PR (docs/tech-plan, section 2).
  flutter: 3.47.3

# Exact versions only (CLAUDE.md). Each package is approved in a decision
# record or a milestone plan; see docs/tech-plan/README.md section 12.
dependencies:
  flutter:
    sdk: flutter
  clock: 1.1.3
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  intl: 0.20.3
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Part of the Flutter SDK; runs the widget tests on a phone (M1 plan, item 17).
  integration_test:
    sdk: flutter
  build_runner: 2.17.1
  drift_dev: 2.35.2
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
